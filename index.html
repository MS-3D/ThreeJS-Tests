<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141618" />
    <meta
      name="description"
      content="Interaktive Roboterzelle: Pick-and-Place am Fließband, frei drehbare Kamera, Endloszyklus."
    />
    <title>Roboterzelle · Pick-and-Place</title>
  </head>
  <body>
    <div id="app" class="is-loading">
      <canvas id="view" aria-label="Interaktive Ansicht der Roboterzelle"></canvas>

      <header class="hud">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div class="titles">
            <h1>Roboterzelle</h1>
            <p>
              <span id="phase">Szene wird geladen</span>
              <span id="clock" class="clock"></span>
            </p>
          </div>
        </div>
        <div class="controls">
          <button id="play" type="button" disabled>Pause</button>
          <div class="speeds" role="group" aria-label="Tempo">
            <button type="button" data-speed="0.5" disabled>0,5×</button>
            <button type="button" data-speed="1" aria-pressed="true" disabled>1×</button>
            <button type="button" data-speed="1.5" disabled>1,5×</button>
            <button type="button" data-speed="2" disabled>2×</button>
          </div>
          <button id="reset" type="button" disabled>Ansicht</button>
          <button id="cinema" type="button" aria-pressed="false" disabled>Rundblick</button>
          <button id="full" type="button">Vollbild</button>
        </div>
      </header>

      <p id="hint" class="hint"></p>

      <div id="loader" role="status" aria-live="polite">
        <div class="panel">
          <span class="mark" aria-hidden="true"></span>
          <h2>Szene wird geladen</h2>
          <p id="loader-detail">Modell, Materialien und Animation</p>
          <div class="bar" id="bar"><span id="bar-fill"></span></div>
          <p id="loader-percent" class="percent">0&nbsp;%</p>
        </div>
      </div>

      <div id="error" class="error" role="alert" hidden>
        <div class="panel">
          <h2>Szene nicht geladen</h2>
          <p id="error-text">Die Datei konnte nicht gelesen werden.</p>
          <button id="retry" type="button">Erneut versuchen</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
